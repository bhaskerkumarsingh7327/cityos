<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Cyan-Blue Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Indigo Gradient -->
    <linearGradient id="accentIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" filter="url(#softShadow)" />

  <!-- Subtle Circuit / Urban Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="392" x2="432" y2="392" />
    <line x1="120" y1="80" x2="120" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="392" y1="80" x2="392" y2="432" />
    <circle cx="120" cy="120" r="4" fill="#38bdf8" />
    <circle cx="392" cy="120" r="4" fill="#38bdf8" />
    <circle cx="120" cy="392" r="4" fill="#38bdf8" />
    <circle cx="392" cy="392" r="4" fill="#38bdf8" />
  </g>

  <!-- Glowing Radar / Pulse Ring (GIS Spatial Node) -->
  <circle cx="256" cy="220" r="148" fill="none" stroke="url(#accentCyan)" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="220" r="112" fill="none" stroke="url(#accentIndigo)" stroke-width="2" opacity="0.4" />

  <!-- The "C" Geometry & Urban Skyline Architecture -->
  <g filter="url(#glow)">
    <!-- Outer Stylized "C" Arc / Geolocation Orbit -->
    <path d="M 330 110
             A 136 136 0 1 0 354 310
             L 310 274
             A 90 90 0 1 1 294 160
             Z"
          fill="url(#accentCyan)" opacity="0.95" />

    <!-- Skyscraper 1 (Left Tower) -->
    <path d="M 175 300 L 175 190 L 205 170 L 205 300 Z" fill="url(#accentIndigo)" />
    <!-- Window Grid 1 -->
    <rect x="183" y="200" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="193" y="200" width="4" height="6" fill="#38bdf8" opacity="0.8" />
    <rect x="183" y="214" width="4" height="6" fill="#38bdf8" opacity="0.8" />
    <rect x="193" y="214" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="183" y="228" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="193" y="228" width="4" height="6" fill="#38bdf8" opacity="0.8" />
    <rect x="183" y="242" width="4" height="6" fill="#38bdf8" opacity="0.8" />
    <rect x="193" y="242" width="4" height="6" fill="#ffffff" opacity="0.8" />

    <!-- Skyscraper 2 (Center Spire - Civic Operations Tower) -->
    <path d="M 220 300 L 220 140 L 246 114 L 246 80 L 250 80 L 250 114 L 276 140 L 276 300 Z" fill="url(#accentCyan)" />
    <!-- Spire Antenna Pulse -->
    <circle cx="248" cy="74" r="6" fill="#34d399" filter="url(#glow)" />
    <!-- Center Tower Windows -->
    <rect x="232" y="160" width="5" height="7" fill="#ffffff" opacity="0.9" />
    <rect x="245" y="160" width="5" height="7" fill="#ffffff" opacity="0.9" />
    <rect x="258" y="160" width="5" height="7" fill="#ffffff" opacity="0.9" />
    <rect x="232" y="178" width="5" height="7" fill="#67e8f9" opacity="0.9" />
    <rect x="245" y="178" width="5" height="7" fill="#ffffff" opacity="0.9" />
    <rect x="258" y="178" width="5" height="7" fill="#67e8f9" opacity="0.9" />
    <rect x="232" y="196" width="5" height="7" fill="#ffffff" opacity="0.9" />
    <rect x="245" y="196" width="5" height="7" fill="#34d399" opacity="0.9" />
    <rect x="258" y="196" width="5" height="7" fill="#ffffff" opacity="0.9" />

    <!-- Skyscraper 3 (Right Tower) -->
    <path d="M 290 300 L 290 180 L 325 204 L 325 300 Z" fill="url(#accentEmerald)" opacity="0.95" />
    <!-- Window Grid 3 -->
    <rect x="300" y="210" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="312" y="210" width="4" height="6" fill="#a7f3d0" opacity="0.8" />
    <rect x="300" y="224" width="4" height="6" fill="#a7f3d0" opacity="0.8" />
    <rect x="312" y="224" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="300" y="238" width="4" height="6" fill="#ffffff" opacity="0.8" />
    <rect x="312" y="238" width="4" height="6" fill="#a7f3d0" opacity="0.8" />

    <!-- Intersecting Geographic Pin Node (Bottom Apex) -->
    <path d="M 248 290 L 210 240 A 26 26 0 0 1 286 240 Z" fill="url(#accentEmerald)" />
    <circle cx="248" cy="240" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Modern Futuristic Typography: CityOS -->
  <text x="256" y="386"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44"
        font-weight="900"
        letter-spacing="5"
        fill="#ffffff">
    CITY<tspan fill="#38bdf8">OS</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="256" y="420"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="3"
        fill="#94a3b8">
    INTELLIGENT URBAN PLATFORM
  </text>

  <!-- Dynamic Status Beacon -->
  <circle cx="370" cy="365" r="4" fill="#34d399" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>

