version: "3.9"

networks:
  cityos-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:

services:
  mongodb:
    image: mongo:7.0
    container_name: cityos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cityos
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - cityos-network

  redis:
    image: redis:7-alpine
    container_name: cityos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cityos-network
